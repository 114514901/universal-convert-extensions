name: build-plugin

on:
  push:
    tags: [ '*-*' ]  # 约定 tag 格式：{插件目录名}-{版本}，如 Pandoc-1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Parse tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $idx = $tag.IndexOf('-')
          if ($idx -le 0) { Write-Error "无效 tag 格式：$tag" }
          echo "PLUGIN=$($tag.Substring(0, $idx))" >> $env:GITHUB_ENV
          echo "VERSION=$($tag.Substring($idx + 1))" >> $env:GITHUB_ENV

      - name: Download Core SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force lib | Out-Null
          # 取最新发布（含 prerelease，如 v2.0.2-dev.x）里的 Core SDK：
          # /releases/latest 只指向最新正式版，可能不含新 API（如 IPreviewProvider）
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/114514901/universal-convert/releases?per_page=20"
          $rel = $releases | Where-Object { -not $_.draft } | Sort-Object { [datetime]$_.published_at } -Descending | Select-Object -First 1
          if (-not $rel) { throw "未找到主仓库发布" }
          $asset = $rel.assets | Where-Object { $_.name -eq "UniversalConvert.Core.SDK.zip" } | Select-Object -First 1
          if (-not $asset) { throw "发布 $($rel.tag_name) 缺少 UniversalConvert.Core.SDK.zip" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\core.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\core.zip" -DestinationPath lib -Force
          Get-ChildItem lib

      - name: Build plugin
        run: msbuild "plugins\${{ env.PLUGIN }}\${{ env.PLUGIN }}Plugin.csproj" /p:Configuration=Release /restore /m

      - name: Download Pandoc
        if: env.PLUGIN == 'Pandoc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/jgm/pandoc/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-x86_64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "未找到 pandoc windows 资产" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\pandoc.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\pandoc.zip" -DestinationPath "$env:RUNNER_TEMP\pandoc"
          $pandoc = Get-ChildItem -Path "$env:RUNNER_TEMP\pandoc" -Recurse -Filter "pandoc.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force package\tools | Out-Null
          Copy-Item $pandoc.FullName package\tools\ -Force

      # MarkItDown：用 PyInstaller 把 Python 运行时 + markitdown[all] 打成单文件 exe 随包分发
      - name: Build MarkItDown tool
        if: env.PLUGIN == 'MarkItDown'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "markitdown[all]"
          python -m pip install --quiet pyinstaller
          # 入口：仓库里的 markitdown_cli.py（不能用包内 __main__.py——
          # 其相对导入在 PyInstaller 顶层脚本模式下会崩溃）
          python -m PyInstaller --onefile --name markitdown --distpath dist `
            --collect-all markitdown `
            --collect-data python_pptx `
            --collect-all rapidocr_onnxruntime `
            --collect-binaries onnxruntime `
            --collect-all magika `
            plugins\MarkItDown\markitdown_cli.py
          New-Item -ItemType Directory -Force package\tools | Out-Null
          Copy-Item dist\markitdown.exe package\tools\ -Force
          Get-Item package\tools\markitdown.exe | Select-Object Name, Length

      # MIDI：下载 FluidSynth（win10-x64，含运行 DLL）与 GeneralUser GS 音色库随包分发
      - name: Download FluidSynth & SoundFont
        if: env.PLUGIN == 'MIDI'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package\tools | Out-Null

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/FluidSynth/fluidsynth/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*win10-x64*" -and $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "未找到 fluidsynth win10-x64 资产" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\fluidsynth.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\fluidsynth.zip" -DestinationPath "$env:RUNNER_TEMP\fluidsynth"
          $fsBin = Get-ChildItem -Path "$env:RUNNER_TEMP\fluidsynth" -Recurse -Filter "fluidsynth.exe" | Select-Object -First 1
          if (-not $fsBin) { throw "fluidsynth.exe 未找到" }
          Copy-Item $fsBin.FullName package\tools\ -Force
          Get-ChildItem $fsBin.DirectoryName -Filter "*.dll" | Copy-Item -Destination package\tools\ -Force

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ROCKNIX/generaluser-gs/main/GeneralUser%20GS%20v1.471.sf2" -OutFile "package\tools\GeneralUser GS v1.471.sf2"
          Get-ChildItem package\tools | Select-Object Name, Length

      # ImageMagick：下载官方 portable 包（7z，Q16-HDRI），整个目录（magick.exe + DLL + modules）随包分发
      - name: Download ImageMagick
        if: env.PLUGIN == 'ImageMagick'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package\tools | Out-Null

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ImageMagick/ImageMagick/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*portable-Q16-HDRI-x64.7z" } | Select-Object -First 1
          if (-not $asset) { throw "未找到 ImageMagick portable 资产" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\imagemagick.7z"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\imagemagick" | Out-Null
          tar -xf "$env:RUNNER_TEMP\imagemagick.7z" -C "$env:RUNNER_TEMP\imagemagick"
          $magick = Get-ChildItem -Path "$env:RUNNER_TEMP\imagemagick" -Recurse -Filter "magick.exe" | Select-Object -First 1
          if (-not $magick) { throw "magick.exe 未找到" }
          Copy-Item "$($magick.DirectoryName)\*" package\tools\ -Recurse -Force
          Get-ChildItem package\tools | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "plugins\$env:PLUGIN\manifest.json" package\ -Force
          Copy-Item "plugins\$env:PLUGIN\bin\Release\net48\UniversalConvert.Plugin.$env:PLUGIN.dll" package\ -Force
          Compress-Archive -Path "package\*" -DestinationPath "$env:PLUGIN-$env:VERSION.zip"
          Get-ChildItem *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.PLUGIN }}-${{ env.VERSION }}.zip"
          generate_release_notes: true
